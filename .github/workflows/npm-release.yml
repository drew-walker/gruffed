name: npm Release

on:
  pull_request:
    paths:
      - ".github/workflows/npm-release.yml"
      - "crates/gruffed-node/**"
      - "packages/gruffed/**"
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to npm"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install -g pnpm@11.9.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: npm-release-${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native package
        working-directory: crates/gruffed-node
        shell: bash
        run: pnpm exec napi build --platform --release --no-js --target ${{ matrix.target }} --output-dir ../../native-artifacts

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: gruffed-node-${{ matrix.target }}
          path: native-artifacts/*.node
          if-no-files-found: error

  package:
    name: Assemble npm packages
    runs-on: ubuntu-latest
    needs: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        run: npm install -g pnpm@11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts
          pattern: gruffed-node-*
          merge-multiple: true

      - name: Create native npm package dirs
        run: pnpm --filter @gruffed/node npm-dirs

      - name: Copy native artifacts into package dirs
        working-directory: crates/gruffed-node
        run: pnpm exec napi artifacts --output-dir ../../native-artifacts

      - name: Prepare package metadata
        working-directory: crates/gruffed-node
        run: pnpm exec napi pre-publish --tag-style npm --no-gh-release --skip-optional-publish

      - name: Pack npm packages
        run: |
          mkdir -p npm-packs
          pnpm --filter @gruffed/node pack --pack-destination ../../npm-packs
          pnpm --filter gruffed pack --pack-destination ../../npm-packs
          find crates/gruffed-node/npm -mindepth 2 -maxdepth 2 -name package.json -print -execdir npm pack --pack-destination "$GITHUB_WORKSPACE/npm-packs" \;

      - name: Upload npm package tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-packs
          path: npm-packs/*.tgz
          if-no-files-found: error

      - name: Publish optional native packages
        if: ${{ github.event_name == 'push' || inputs.publish == true }}
        working-directory: crates/gruffed-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec napi pre-publish --tag-style npm --no-gh-release

      - name: Publish @gruffed/node
        if: ${{ github.event_name == 'push' || inputs.publish == true }}
        working-directory: crates/gruffed-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish gruffed
        if: ${{ github.event_name == 'push' || inputs.publish == true }}
        working-directory: packages/gruffed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
